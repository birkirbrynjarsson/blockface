<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>blockface</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0e11;
        --panel: #12161b;
        --border: #232933;
        --text: #e7ebf0;
        --muted: #8a95a5;
        --accent: #f7931a;
        --good: #3ecf8e;
        --bad: #e5534b;
        --mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas,
          monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7f9;
          --panel: #ffffff;
          --border: #e2e5ea;
          --text: #171b21;
          --muted: #626b79;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        padding: 2rem 1.25rem 4rem;
      }
      main {
        max-width: 840px;
        margin: 0 auto;
      }
      header.page {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
        gap: 1rem;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 1.15rem;
        margin: 0;
        letter-spacing: -0.01em;
      }
      h1 span {
        color: var(--accent);
      }
      .status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        transition: background 0.2s;
      }
      .dot.live {
        background: var(--good);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent);
      }
      .dot.down {
        background: var(--bad);
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem 1.5rem;
        margin-bottom: 1.25rem;
      }
      .panel h2 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 1rem;
        font-weight: 600;
      }
      .tip-height {
        font-family: var(--mono);
        font-size: 2.25rem;
        font-weight: 600;
        line-height: 1;
        margin-bottom: 0.35rem;
      }
      .tip-hash {
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--muted);
        word-break: break-all;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1rem;
        margin-top: 1.25rem;
      }
      .stat .label {
        font-size: 0.72rem;
        color: var(--muted);
        margin-bottom: 0.25rem;
      }
      .stat .value {
        font-family: var(--mono);
        font-size: 1rem;
        font-weight: 600;
      }
      .log {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 320px;
        overflow-y: auto;
      }
      .log li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        font-family: var(--mono);
        font-size: 0.82rem;
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--border);
      }
      .log li:last-child {
        border-bottom: none;
      }
      .log .hash {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .log .height {
        color: var(--accent);
        flex-shrink: 0;
      }
      .empty {
        color: var(--muted);
        font-size: 0.85rem;
      }
      footer {
        text-align: center;
        color: var(--muted);
        font-size: 0.75rem;
        margin-top: 2rem;
      }
      footer a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="page">
        <h1><span>&#8383;</span> blockface</h1>
        <div class="status">
          <span class="dot" id="dot"></span>
          <span id="status-text">connecting&hellip;</span>
        </div>
      </header>

      <section class="panel">
        <h2>Current tip</h2>
        <div class="tip-height" id="tip-height">&mdash;</div>
        <div class="tip-hash" id="tip-hash">waiting for data&hellip;</div>
        <div class="grid">
          <div class="stat">
            <div class="label">Last block</div>
            <div class="value" id="stat-age">&mdash;</div>
          </div>
          <div class="stat">
            <div class="label">Avg interval</div>
            <div class="value" id="stat-interval">&mdash;</div>
          </div>
          <div class="stat">
            <div class="label">Difficulty</div>
            <div class="value" id="stat-difficulty">&mdash;</div>
          </div>
          <div class="stat">
            <div class="label">Est. hashrate</div>
            <div class="value" id="stat-hashrate">&mdash;</div>
          </div>
          <div class="stat">
            <div class="label">Retarget in</div>
            <div class="value" id="stat-retarget">&mdash;</div>
          </div>
          <div class="stat">
            <div class="label">Halving in</div>
            <div class="value" id="stat-halving">&mdash;</div>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>Live feed</h2>
        <ul class="log" id="log">
          <li class="empty">No headers received yet this session.</li>
        </ul>
      </section>

      <footer>
        JSON API at <a href="/api/stats">/api/stats</a>,
        <a href="/api/headers">/api/headers</a> and
        <a href="/api/headers/0">/api/headers/:height</a>
      </footer>
    </main>

    <script>
      const dot = document.getElementById("dot");
      const statusText = document.getElementById("status-text");
      const tipHeight = document.getElementById("tip-height");
      const tipHash = document.getElementById("tip-hash");
      const log = document.getElementById("log");

      const fmtInt = new Intl.NumberFormat();

      function fmtDuration(seconds) {
        if (seconds === null || seconds === undefined) return "—";
        seconds = Math.max(0, Math.round(seconds));
        const d = Math.floor(seconds / 86400);
        const h = Math.floor((seconds % 86400) / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        if (d > 0) return `${d}d ${h}h`;
        if (h > 0) return `${h}h ${m}m`;
        return `${m}m`;
      }

      function fmtHashrate(hashesPerSecond) {
        if (!hashesPerSecond) return "—";
        const units = ["H/s", "kH/s", "MH/s", "GH/s", "TH/s", "PH/s", "EH/s", "ZH/s"];
        let value = hashesPerSecond;
        let i = 0;
        while (value >= 1000 && i < units.length - 1) {
          value /= 1000;
          i += 1;
        }
        return `${value.toFixed(2)} ${units[i]}`;
      }

      function renderStats(stats) {
        tipHeight.textContent = fmtInt.format(stats.height);
        tipHash.textContent = stats.hash ?? "—";
        document.getElementById("stat-age").textContent =
          stats.secondsSinceLastBlock !== null
            ? `${fmtDuration(stats.secondsSinceLastBlock)} ago`
            : "—";
        document.getElementById("stat-interval").textContent =
          stats.averageBlockIntervalSeconds !== null
            ? fmtDuration(stats.averageBlockIntervalSeconds)
            : "—";
        document.getElementById("stat-difficulty").textContent =
          stats.difficulty !== null
            ? Number(stats.difficulty).toExponential(2)
            : "—";
        document.getElementById("stat-hashrate").textContent = fmtHashrate(
          stats.estimatedHashrate
        );
        document.getElementById("stat-retarget").textContent =
          `${fmtInt.format(stats.blocksUntilRetarget)} blocks`;
        document.getElementById("stat-halving").textContent =
          `${fmtInt.format(stats.blocksUntilHalving)} blocks`;
      }

      function pushHeader(header) {
        const empty = log.querySelector(".empty");
        if (empty) empty.remove();

        const item = document.createElement("li");
        const height = document.createElement("span");
        height.className = "height";
        height.textContent = `#${fmtInt.format(header.height)}`;
        const hash = document.createElement("span");
        hash.className = "hash";
        hash.textContent = header.hash;
        item.append(height, hash);
        log.prepend(item);

        while (log.children.length > 25) {
          log.removeChild(log.lastChild);
        }
      }

      function setStatus(state) {
        dot.className = `dot ${state}`;
        statusText.textContent =
          state === "live"
            ? "live"
            : state === "down"
              ? "disconnected — retrying…"
              : "connecting…";
      }

      function connect() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${proto}//${location.host}/ws`);

        ws.addEventListener("open", () => setStatus("live"));
        ws.addEventListener("close", () => {
          setStatus("down");
          setTimeout(connect, 2000);
        });
        ws.addEventListener("error", () => ws.close());

        ws.addEventListener("message", (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === "tip") {
            renderStats(msg.stats);
            pushHeader(msg.header);
          } else if (msg.type === "stats") {
            renderStats(msg.stats);
          }
        });
      }

      connect();
    </script>
  </body>
</html>
